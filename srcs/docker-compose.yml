networks:
  frontend:
  backend:

services:
  nginx:
    build:
      context: ./requirement/Nginx/
    hostname: iguidado.42.fr
    container_name: nginx
    ports:
      - "443:443"
    networks:
      - frontend
    restart: always
    volumes:
      - website:/var/www/wordpress/
    depends_on:
      - wordpress

  wordpress:
    build:
      context: ./requirement/Wordpress
      args:
        - WP_PATH=${WP_PATH}
        - WORDPRESS_DB_HOST=${MARIADB_HOST}
        - WORDPRESS_DB_USER=${MARIADB_USER}
        - WORDPRESS_DB_PASS=${MARIADB_PASSWORD}
        - WORDPRESS_DB_NAME=${MARIADB_DATABASE}
        - WORDPRESS_REDIS_HOST=${REDIS_HOST}
        - WORDPRESS_TABLE_PREFIX=${TABLE_PREFIX}
    environment:
      - WP_PATH=${WP_PATH}
      - WORDPRESS_DB_HOST=${MARIADB_HOST}
      - WORDPRESS_DB_USER=${MARIADB_USER}
      - WORDPRESS_DB_PASS=${MARIADB_PASSWORD}
      - WORDPRESS_DB_NAME=${MARIADB_DATABASE}
      - WORDPRESS_REDIS_HOST=${REDIS_HOST}
      - WORDPRESS_TABLE_PREFIX=${TABLE_PREFIX}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_PASS=${WP_ADMIN_PASS}
      - WP_ADMIN_MAIL=${WP_ADMIN_MAIL}
    container_name: wordpress
    expose:
      - "9000"
    depends_on:
      - mariadb
    networks:
      - frontend
      - backend
    restart: always
    volumes:
      - website:/var/www/wordpress/

  mariadb:
    env_file: .env
    build:
      context: ./requirement/Mariadb
      args: 
        - DB_NAME=${MARIADB_DATABASE}
        - DB_ADMIN=${MARIADB_USER}
        - DB_ADMIN_PASS=${MARIADB_PASSWORD}
        - MARIADB_ROOT_PASS=${MARIADB_ROOT_PASS}
    volumes:
      - database:/var/lib/mysql/
    container_name: mariadb
    expose:
      - "3306"
    networks:
      - backend
    restart: always

  adminer:
    build:
      context: requirement/Bonus/Adminer/
    container_name: adminer
    depends_on:
      - wordpress
    restart: always
    expose:
      - "9000"
    networks:
      - frontend
      - backend
    volumes:
      - website:/var/www/wordpress/

  redis:
    build:
      context: requirement/Bonus/Redis/
    container_name: redis
    restart: always
    expose:
      - "6379"
    networks:
      - backend

volumes:
  website:
    driver: local
    driver_opts:
      o : bind
      type : none
      device: /home/lambda/data/wordpress
  database:
    driver: local
    driver_opts:
      o : bind
      type : none
      device: /home/lambda/data/db
